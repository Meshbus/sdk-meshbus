# Peripherals
CONFIG_GPIO=y
CONFIG_I2C=y

# Power Management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_PM_DEVICE_RUNTIME_ASYNC=y

# Preserve the provisioned MCUboot image and place this sample in slot0.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_GENERATE_UNSIGNED_IMAGE=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

# Match the 50 Hz MMC5603 stream (LSM6DSL value index: 3 => 52 Hz).
CONFIG_LSM6DSL_ACCEL_ODR=3
CONFIG_LSM6DSL_GYRO_ODR=3
