# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

# This sample performs sensor fusion + frequent logging in main thread.
# Increase main stack to avoid runtime stack overflow on smaller defaults.
CONFIG_MAIN_STACK_SIZE=4096

# Sensor framework
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SENSOR_SHELL=y
CONFIG_SENSOR=y
CONFIG_COMPASS_COMPOSITE=y

CONFIG_SENSOR_LOG_LEVEL_DBG=y
