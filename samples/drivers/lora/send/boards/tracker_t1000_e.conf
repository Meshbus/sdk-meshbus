# Give the USB CDC console time to enumerate before the sample starts logging.
CONFIG_BOOT_DELAY=2000

# Keep LR11XX hardware reset/configuration out of the early boot init path.
CONFIG_LORA_BASICS_MODEM_DEFERRED_INIT=y

# Avoid flooding the CDC backend while preserving application-level send logs.
CONFIG_LORA_LOG_LEVEL_INF=y
