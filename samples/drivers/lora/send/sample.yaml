common:
  tags: lora
  depends_on: lora
  harness: console
  harness_config:
    type: one_line
    regex:
      - "<inf> lora_send: Data sent 0!"
sample:
  description: Demonstration of LoRa Send functionality
  name: LoRa Send Sample
tests:
  sample.driver.lora.send:
    integration_platforms:
      - b_l072z_lrwan1
  sample.driver.lora.send.lbm:
    filter: dt_compat_enabled("semtech,sx1261") or
      dt_compat_enabled("semtech,sx1262") or
      dt_compat_enabled("semtech,lr1110") or
      dt_compat_enabled("semtech,lr1120") or
      dt_compat_enabled("semtech,lr2021") or
      dt_compat_enabled("semtech,sx1272") or
      dt_compat_enabled("semtech,sx1276")
    integration_platforms:
      - b_l072z_lrwan1
      - rak11720
    extra_configs:
      - CONFIG_LORA_MODULE_BACKEND_LORA_BASICS_MODEM=y
  sample.driver.lora.send.lr2021_build:
    build_only: true
    platform_allow:
      - tracker_t1000_e
    extra_args: DTC_OVERLAY_FILE=../boards/tracker_t1000_e_lr2021.overlay
    extra_configs:
      - CONFIG_LORA_MODULE_BACKEND_LORA_BASICS_MODEM=y
      - CONFIG_LORA_BASICS_MODEM_DEFERRED_INIT=y
