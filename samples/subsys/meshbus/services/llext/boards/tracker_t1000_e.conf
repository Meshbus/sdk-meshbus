# Nordic SoC
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
CONFIG_USERSPACE=n
CONFIG_MPU=n
CONFIG_ARM_MPU=n

# Peripherals
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Indicator service peripheral dependencies
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SHELL=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_PM_DEVICE_RUNTIME_ASYNC=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="MeshCore-FoBE"
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Seeed"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="T1000-E"
CONFIG_BT_BAS=y
CONFIG_BT_TPS=y

# The OS datetime group is unavailable in this Zephyr revision.
CONFIG_MCUMGR_GRP_OS_DATETIME=n
CONFIG_MCUMGR_GRP_OS_DATETIME_HOOK=n
