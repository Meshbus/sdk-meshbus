CONFIG_USERSPACE=n
CONFIG_MPU=n
CONFIG_ARM_MPU=n

# Keep serial and flash/fs support explicit for shell + littlefs workflow
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Indicator service peripheral dependencies
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_LED=y

# Power domain support used by board indicator chosen nodes
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SHELL=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_PM_DEVICE_RUNTIME_ASYNC=y
