# Board-specific Kconfig overrides for idea_mesh_tracker_c2/nrf54l15/cpuapp.
#
# Keep this file even if empty: Zephyr's build system will look for it when a
# matching overlay file exists.

# RRAM settings writes are short and can safely run without BLE ticker
# synchronization here. The ticker-synchronized path can time out while
# persisting bonding keys during an active connection.
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_NONE=y
