# Nordic SoC
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y

# Peripherals
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y

# Power Management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SHELL=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_PM_DEVICE_RUNTIME_ASYNC=y
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_COMPOSITE=y
CONFIG_CHARGER=y
CONFIG_CHARGER_COMPOSITE=y

CONFIG_POWEROFF=y
CONFIG_REBOOT=y
