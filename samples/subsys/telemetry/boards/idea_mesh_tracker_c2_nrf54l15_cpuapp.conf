# Peripherals
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y

# Power Management
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_SHELL=y
CONFIG_POWER_DOMAIN=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_PM_DEVICE_RUNTIME_ASYNC=y

CONFIG_I2C=y

CONFIG_SENSOR=y
CONFIG_SENSOR_SHELL=y

CONFIG_LSM6DSL_GYRO_ODR=1
CONFIG_LSM6DSL_ACCEL_ODR=1
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_LSM6DSL_TRIGGER_NONE=y
