CONFIG_CHIP=y
CONFIG_CHIP_WIFI=y
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBCPP=y
CONFIG_PICOLIBC=y
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="FoBE Matter Temp"
CONFIG_PSA_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_CHIP_CRYPTO_PSA=y
CONFIG_CHIP_CRYPTO_SPAKE2P_MBEDTLS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_CHIP_EXAMPLE_DEVICE_INFO_PROVIDER=n
CONFIG_NET_STATISTICS=y
CONFIG_NET_STATISTICS_USER_API=y
CONFIG_CHIP_DEVICE_VENDOR_ID=65521
CONFIG_CHIP_DEVICE_PRODUCT_ID=32768
CONFIG_CHIP_DEVICE_PRODUCT_NAME="FoBE Matter Temperature"
CONFIG_CHIP_DEVICE_TYPE=770
CONFIG_CHIP_DEVICE_DISCRIMINATOR=0xF00
CONFIG_CHIP_DEVICE_SPAKE2_PASSCODE=20202021
CONFIG_CHIP_CRYPTO_PSA_AEAD_SINGLE_PART=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=12
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_MAX_CONN=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_CHIP_TASK_STACK_SIZE=8192
CONFIG_CHIP_TASK_PRIORITY=5
CONFIG_MATTER_LOG_LEVEL=3
CONFIG_CHIP_ENABLE_WIFI_STATION=y
CONFIG_CHIP_DEVICE_VENDOR_NAME="FoBE"
# Matter's entropy initialization guard recognizes this hardware-backed path.
CONFIG_MBEDTLS_PSA_CRYPTO_LEGACY_RNG=y
CONFIG_MBEDTLS_PSA_DRIVER_GET_ENTROPY=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_PBKDF2_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_1=y
CONFIG_MBEDTLS_X509_CRT_PARSE_C=y
CONFIG_MBEDTLS_X509_CSR_WRITE_C=y
CONFIG_MBEDTLS_PK_WRITE_C=y
# Required by the generic Matter BLE and thread diagnostics adapters.
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_INIT_STACKS=y
# IPv4/IPv6 operational sockets, mDNS sockets and the Matter wake event.
CONFIG_ZVFS_POLL_MAX=16
CONFIG_NET_MAX_CONTEXTS=10
# Test DAC import and persistent operational key serialization/restoration.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y

# Matter commissioning messages need more than the default logging stack.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
# Matter GATT callbacks need additional receive-thread stack on ESP32-C6.
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y

# Retry transient AP association failures after restoring a paired device.
CONFIG_ESP32_WIFI_STA_RECONNECT=y

# The local adapter preserves ENS160 conditioning states.
CONFIG_ENS160=n
