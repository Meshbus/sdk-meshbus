schema: spec-driven

context: |
  Meshbus contains a Zephyr module/product, a Rust CLI and Python tools.
  AGENTS.md owns authorization and task-specific reading routes; follow only relevant sections.
  DEVELOPMENT.md owns engineering practices; docs/testing.md owns check selection and evidence.
  Specs describe agreed behavior; use current source and tests to establish implementation.
  Shared artifacts use English; discuss work in the user's language.
  Markdown artifacts need no per-file SPDX declarations; do not add them.
  Repository SPDX checks are incremental by default; web/ is temporarily excluded in every mode.
  AGENTS.md defines SPDX scope; retrieve LICENSING.md for external inputs or distribution changes.
  Use npm run openspec -- <arguments> from the Git root.

rules:
  proposal:
    - State the observable outcome, affected consumers, scope and non-goals.
  specs:
    - Express observable behavior and relevant reachable failures through testable WHEN/THEN scenarios.
  design:
    - Explain the relevant trade-offs without repeating specs; apply DEVELOPMENT.md engineering contracts.
    - Resolve decisions that change scope or acceptance before implementation.
  tasks:
    - Group tasks by deliverable with a verification method; use the implementation loop and evidence boundaries in docs/testing.md.
    - Identify required device or release acceptance separately; use appropriate document/configuration checks where runtime TDD does not apply.

operations:
  apply:
    guidance:
      - Record concise actual outcomes, source/build identity and remaining gaps in the existing tasks.md; mark complete only after the stated acceptance passes.
      - Surface source/spec discrepancies and revise the agreed change rather than weakening acceptance.
  archive:
    guidance:
      - Archive only after required tasks and acceptance pass; structural validation does not substitute for implementation evidence or review.
      - Retain completed records for targeted historical retrieval; do not rewrite their evidence or original paths.
