# On 2026-09-23 the maintainer confirmed that the original Desktop images were
# created/generated by the project, not merely converted from third-party art.
# Cover those inputs, their generated icon/bitmap data and the logo tooling/docs.
# Ownership metadata covers retained files, independently of runtime selection.
# Desktop consumes generated C data; these patterns do not imply image-file use.
# The separately confirmed project-designed segment fonts are annotated below.
