name: Set up west workspace
description: Update pinned dependencies directly from this checkout's west.yml
runs:
  using: composite
  steps:
    - name: Reserve disk for dependencies and builds
      if: runner.os == 'Linux'
      shell: bash
      run: bash meshbus/scripts/ci/prepare-disk.sh container
    - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
      with:
        name: source-snapshot
        path: snapshot
    - name: Update dependencies and check version records
      shell: bash
      run: python meshbus/scripts/ci/workspace.py --workspace "$GITHUB_WORKSPACE" --verify snapshot
