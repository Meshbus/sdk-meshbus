# Paths are repository-relative, case-sensitive fnmatch patterns (* includes /).
# Roots select Twister metadata recursively, never duplicate scenarios/platforms.
# Include known consumers as well as the component's own contract tests. Review
# these relationships when adding a consumer, public API, or integration fixture.
# Consumers are reverse dependencies, including conditional header/API users;
# their roots and consumers are included transitively (cycles are supported).
# Unmapped paths and source Kconfig/CMake changes select the entire SDK.
shared = ["subsys/settings/*", "subsys/mgmt/*", "subsys/shell/*", "subsys/clock/time.c"]

[components.clock]
consumers = [
    "contact",
    "desktop",
    "llext",
    "meshcore",
    "message",
]
paths = ["subsys/clock/*"]
roots = [
    "tests/subsys/clock",
    "tests/subsys/mgmt/config_handlers",
    "tests/subsys/contact",
    "tests/subsys/message",
    "tests/subsys/meshcore",
    "tests/subsys/desktop",
    "tests/subsys/llext",
    "samples/subsys/clock",
]

