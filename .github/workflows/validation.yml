name: Validation
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
      strict:
        description: Require clean CLI packages built afresh
        type: boolean
        default: false
      reuse-twister:
        description: Require successful full CI Twister evidence for this exact source and builder
        type: boolean
        default: false
      retention-days:
        type: number
        default: 14
      image:
        type: string
        default: stable
      benchmark-case:
        type: string
        default: ''
      scheduler:
        type: string
        default: balanced
      benchmark-sha:
        type: string
        default: ''
      history-artifact:
        type: string
        default: ''
      history-sha256:
        type: string
        default: ''
      inventory-sha256:
        type: string
        default: ''
    outputs:
      image:
        value: ${{ jobs.plan.outputs.image }}
      products:
        value: ${{ jobs.prepare.outputs.products }}
permissions:
  contents: read
  actions: read
concurrency:
  group: validation-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  plan:
    name: Plan validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      image: ${{ steps.image.outputs.image }}
      sdk: ${{ steps.reuse.outputs.sdk || steps.plan.outputs.sdk }}
      products: ${{ steps.plan.outputs.products }}
      product-builds: ${{ steps.reuse.outputs.product_builds || steps.plan.outputs.product_builds }}
      openspec: ${{ steps.plan.outputs.openspec }}
      workspace: ${{ steps.plan.outputs.workspace }}
      heavy: ${{ steps.plan.outputs.heavy }}
      audit: ${{ steps.plan.outputs.audit }}
      west-audit: ${{ steps.plan.outputs.west_audit }}
      audit-current: ${{ steps.plan.outputs.audit_current }}
      fonts: ${{ steps.plan.outputs.fonts }}
      checkpatch: ${{ steps.plan.outputs.checkpatch }}
      rust: ${{ steps.plan.outputs.rust }}
      host: ${{ steps.plan.outputs.host }}
      cli: ${{ steps.plan.outputs.cli }}
      cli-profile: ${{ steps.plan.outputs.cli_profile }}
      linux: ${{ steps.plan.outputs.linux_targets }}
      mac: ${{ steps.plan.outputs.mac_targets }}
      native: ${{ steps.plan.outputs.native_targets }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          fetch-depth: 0
          persist-credentials: false
      - name: Install planning parser
        run: python -m pip install -c meshbus/.github/docker/requirements.lock PyYAML
      - id: plan
        working-directory: meshbus
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          FULL: ${{ inputs.full || inputs.strict }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BENCHMARK_CASE: ${{ inputs.benchmark-case }}
          SCHEDULER: ${{ inputs.scheduler }}
          BENCHMARK_SHA: ${{ inputs.benchmark-sha }}
          IMAGE_INPUT: ${{ inputs.image }}
          HISTORY_ARTIFACT: ${{ inputs.history-artifact }}
          HISTORY_SHA256: ${{ inputs.history-sha256 }}
          INVENTORY_SHA256: ${{ inputs.inventory-sha256 }}
        run: |
          args=()
          if [[ -n "$PR_BASE" ]]; then args+=(--base "$PR_BASE"); fi
          if [[ "$EVENT" == push ]]; then args+=(--before "$BEFORE"); fi
          if [[ "$FULL" == true || "$EVENT" == schedule || "$EVENT" == workflow_dispatch ]]; then args+=(--full --audit-current); fi
          python scripts/ci/plan.py "${args[@]}" --output ../snapshot/plan.json
          python scripts/ci/benchmark.py configure --snapshot ../snapshot \
            --case "$BENCHMARK_CASE" --scheduler "$SCHEDULER" --source "$BENCHMARK_SHA" \
            --image "$IMAGE_INPUT" --history-artifact "$HISTORY_ARTIFACT" \
            --history-sha256 "$HISTORY_SHA256" --inventory-sha256 "$INVENTORY_SHA256"
      - id: image
        if: steps.plan.outputs.heavy == 'true'
        env:
          IMAGE_REF: ${{ inputs.image }}
        run: python meshbus/scripts/ci/image.py --repository Meshbus/sdk-meshbus --reference "${IMAGE_REF#ghcr.io/meshbus/sdk-meshbus-builder@}"
      - name: Reuse successful full CI Twister validation
        id: reuse
        if: inputs.reuse-twister
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.image.outputs.image }}
        run: >-
          python meshbus/scripts/ci/baseline.py select --snapshot snapshot
          --manifest meshbus/west.yml --image "$IMAGE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ci-plan
          path: snapshot
          if-no-files-found: error

  prepare:
    needs: plan
    if: needs.plan.outputs.workspace == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      image: ${{ needs.plan.outputs.image }}
      shards: ${{ steps.shards.outputs.matrix }}
      products: ${{ steps.products.outputs.matrix }}
      product-builds: ${{ steps.products.outputs.builds }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          fetch-depth: 0
          persist-credentials: false
      - name: Reserve disk for image and dependencies
        run: bash meshbus/scripts/ci/prepare-disk.sh host 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-plan
          path: snapshot
      - name: Update pinned dependencies and record versions
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.meshbus.builder.schema" }}' "$IMAGE")" = 1
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            bash -euc '
              git config --global --add safe.directory /work/meshbus
              python meshbus/scripts/ci/workspace.py --workspace /work --record /work/snapshot
              python meshbus/scripts/ci/cli_workspace.py record --workspace /work --snapshot /work/snapshot
              cp -r /opt/builder /work/snapshot/tools
              chmod -R a+rX /work/snapshot/tools
            '
          printf '%s\n' "$IMAGE" > snapshot/image.txt
      - id: products
        if: needs.plan.outputs.products == 'true'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" \
            python meshbus/scripts/release/release.py matrix > snapshot/products.json
          python meshbus/scripts/ci/product_impact.py --plan snapshot/plan.json \
            --matrix snapshot/products.json --builds snapshot/product-builds.json
          echo "matrix=$(jq -c . snapshot/products.json)" >> "$GITHUB_OUTPUT"
          echo "builds=$(jq -c . snapshot/product-builds.json)" >> "$GITHUB_OUTPUT"
      - name: Verify reused test and product evidence
        if: inputs.reuse-twister
        run: python meshbus/scripts/ci/baseline.py verify --snapshot snapshot
      - name: Load compatible scheduling measurements
        if: needs.plan.outputs.sdk == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.plan.outputs.image }}
        run: python meshbus/scripts/ci/timings.py history --snapshot snapshot --image "$IMAGE"
      - id: shards
        if: needs.plan.outputs.sdk == 'true'
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work "$IMAGE" bash -euc '
            git config --global --add safe.directory /work/meshbus
            python meshbus/scripts/ci/test_plan.py generate --workspace /work --snapshot /work/snapshot
          '
          echo "matrix=$(jq -c '{include: .include}' snapshot/shards.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-snapshot
          path: snapshot
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  lightweight:
    name: Source checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: meshbus/.github/docker/requirements.lock
      - id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/source-tool-archives
          key: source-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('meshbus/.github/docker/install-tools.py') }}
      - name: Install existing pinned source-check tools
        run: |
          python -m pip install -c meshbus/.github/docker/requirements.lock PyYAML reuse ruff
          python meshbus/.github/docker/install-tools.py --light --prefix "$RUNNER_TEMP/source-tools" \
            --cache-dir "$RUNNER_TEMP/source-tool-archives"
          echo "$RUNNER_TEMP/source-tools/actionlint" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/source-tools/gitleaks" >> "$GITHUB_PATH"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/source-tool-archives
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Metadata
        run: python meshbus/scripts/ci/metadata.py
      - name: Documentation
        if: ${{ !cancelled() }}
        run: python meshbus/scripts/ci/docs.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: needs.plan.outputs.openspec == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: meshbus/package-lock.json
      - name: OpenSpec requirements
        if: needs.plan.outputs.openspec == 'true'
        working-directory: meshbus
        env:
          OPENSPEC_TELEMETRY: '0'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run spec:check
          npm run openspec -- validate --archived --strict --no-interactive
      - name: Secrets
        if: ${{ !cancelled() }}
        run: python meshbus/scripts/ci/quality.py secrets
      - name: Repository license policy
        if: ${{ !cancelled() }}
        env:
          FULL: ${{ inputs.full || inputs.strict || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          args=()
          if [[ "$FULL" == true ]]; then args+=(--current); fi
          python meshbus/scripts/ci/quality.py licenses "${args[@]}"
      - name: Workflow, Python and commit style
        if: ${{ !cancelled() }}
        run: python meshbus/scripts/ci/quality.py style
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: source-checks
          path: ci-output
          retention-days: 14

  quality:
    name: Workspace checks
    needs: [plan, prepare]
    if: needs.plan.outputs.fonts == 'true' || needs.plan.outputs.checkpatch == 'true' || needs.plan.outputs.audit == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.image }}
      volumes:
        - /usr/local/lib/android:/__host_sdks/android
        - /usr/share/dotnet:/__host_sdks/dotnet
        - /opt/ghc:/__host_sdks/ghc
        - /usr/local/.ghcup:/__host_sdks/ghcup
        - /opt/hostedtoolcache/CodeQL:/__host_sdks/codeql
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          fetch-depth: 0
          persist-credentials: false
      - uses: ./meshbus/.github/actions/workspace
      - name: Font inventory
        if: needs.plan.outputs.fonts == 'true'
        run: python meshbus/scripts/ci/quality.py fonts
      - name: C/C++ patch style
        if: ${{ !cancelled() && needs.plan.outputs.checkpatch == 'true' }}
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python meshbus/scripts/ci/quality.py checkpatch
      - name: Cargo vulnerabilities
        if: ${{ !cancelled() && needs.plan.outputs.audit == 'true' }}
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CURRENT: ${{ needs.plan.outputs.audit-current }}
        run: |
          args=()
          if [[ "$CURRENT" == true ]]; then args+=(--current); fi
          python meshbus/scripts/ci/quality.py vulnerabilities "${args[@]}"
      - name: West dependency vulnerability report
        if: ${{ !cancelled() && needs.plan.outputs.west-audit == 'true' }}
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CURRENT: ${{ needs.plan.outputs.audit-current }}
        run: |
          args=()
          if [[ "$CURRENT" == true ]]; then args+=(--current); fi
          python meshbus/scripts/ci/quality.py west-vulnerabilities "${args[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: workspace-checks
          path: ci-output
          retention-days: 14

  host:
    name: Host / Python and Rust
    needs: [plan, prepare]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.host == 'true' && (needs.prepare.result == 'success' || needs.plan.outputs.workspace == 'false') }}
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.plan.outputs.image }}
      volumes:
        - /usr/local/lib/android:/__host_sdks/android
        - /usr/share/dotnet:/__host_sdks/dotnet
        - /opt/ghc:/__host_sdks/ghc
        - /usr/local/.ghcup:/__host_sdks/ghcup
        - /opt/hostedtoolcache/CodeQL:/__host_sdks/codeql
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - uses: ./meshbus/.github/actions/workspace
        if: needs.plan.outputs.rust == 'true'
      - uses: ./meshbus/.github/actions/cargo-cache
        if: needs.plan.outputs.rust == 'true'
        with:
          target: host-test
          image: ${{ needs.plan.outputs.image }}
      - env:
          RUST: ${{ needs.plan.outputs.rust }}
        run: |
          args=()
          if [[ "$RUST" != true ]]; then args+=(--python-only); fi
          python meshbus/scripts/ci/run.py host "${args[@]}"

  zephyr:
    name: ${{ matrix.name }}
    needs: [plan, prepare]
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.image }}
      volumes:
        - /usr/local/lib/android:/__host_sdks/android
        - /usr/share/dotnet:/__host_sdks/dotnet
        - /opt/ghc:/__host_sdks/ghc
        - /usr/local/.ghcup:/__host_sdks/ghcup
        - /opt/hostedtoolcache/CodeQL:/__host_sdks/codeql
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.shards) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - uses: ./meshbus/.github/actions/workspace
      - id: ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-v4-${{ needs.prepare.outputs.image }}-${{ inputs.benchmark-case || 'ci' }}-${{ inputs.scheduler }}-${{ matrix.id }}-${{ github.sha }}
          restore-keys: |
            ccache-v4-${{ needs.prepare.outputs.image }}-${{ inputs.benchmark-case || 'ci' }}-${{ inputs.scheduler }}-${{ matrix.id }}-
      - env:
          JOB: ${{ matrix.id }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_MAXSIZE: 2G
        run: python meshbus/scripts/ci/run.py twister --job "$JOB"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: ${{ !cancelled() && steps.ccache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        with:
          path: .ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: zephyr-${{ matrix.id }}
          path: |
            ci-output/**/twister.json
            ci-output/**/task-timing.json
            ci-output/**/*.xml
            ci-output/**/*.log
          retention-days: 14

  cli-linux:
    needs: [plan, prepare]
    if: needs.plan.outputs.cli == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.image }}
      volumes:
        - /usr/local/lib/android:/__host_sdks/android
        - /usr/share/dotnet:/__host_sdks/dotnet
        - /opt/ghc:/__host_sdks/ghc
        - /usr/local/.ghcup:/__host_sdks/ghcup
        - /opt/hostedtoolcache/CodeQL:/__host_sdks/codeql
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: source-snapshot
          path: snapshot
      - run: bash meshbus/scripts/ci/prepare-disk.sh container 8
      - run: python meshbus/scripts/ci/cli_workspace.py setup
      - uses: ./meshbus/.github/actions/cargo-cache
        with:
          target: ${{ matrix.target }}
          image: ${{ needs.prepare.outputs.image }}
          candidate: ${{ inputs.strict }}
          profile: ${{ needs.plan.outputs.cli-profile }}
      - env:
          TARGET: ${{ matrix.target }}
          CANDIDATE: ${{ inputs.strict }}
          PROFILE: ${{ needs.plan.outputs.cli-profile }}
          CARGO_BUILD_JOBS: 2
          BUILDER_IMAGE: ${{ needs.prepare.outputs.image }}
          XWIN_CACHE_DIR: ${{ github.workspace }}/xwin-cache
          XWIN_VERSION: 17
          XWIN_SDK_VERSION: 10.0.26100
          XWIN_CRT_VERSION: 14.44.17.14
        run: |
          args=()
          if [[ "$CANDIDATE" == true ]]; then args+=(--candidate); fi
          python meshbus/scripts/ci/run.py cli --target "$TARGET" --profile "$PROFILE" "${args[@]}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-${{ matrix.target }}
          path: ci-output/parts/cli/${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  cli-mac:
    needs: [plan, prepare]
    if: needs.plan.outputs.cli == 'true'
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-build
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.mac) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -c meshbus/.github/docker/requirements.lock west PyYAML jsonschema
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup target add "$TARGET"
          if [[ "$TARGET" == x86_64-apple-darwin ]]; then arch -x86_64 /usr/bin/true; fi
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: source-snapshot
          path: snapshot
      - run: python meshbus/scripts/ci/cli_workspace.py setup
      - uses: ./meshbus/.github/actions/cargo-cache
        with:
          target: ${{ matrix.target }}
          image: rust-1.97.1-${{ matrix.runner }}
          candidate: ${{ inputs.strict }}
          profile: ${{ needs.plan.outputs.cli-profile }}
      - env:
          TARGET: ${{ matrix.target }}
          CANDIDATE: ${{ inputs.strict }}
          PROFILE: ${{ needs.plan.outputs.cli-profile }}
        run: |
          args=()
          if [[ "$CANDIDATE" == true ]]; then args+=(--candidate); fi
          python meshbus/scripts/ci/run.py cli --target "$TARGET" --profile "$PROFILE" "${args[@]}"
          cargo test --locked --target "$TARGET" --manifest-path meshbus/scripts/meshbus/Cargo.toml
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-${{ matrix.target }}
          path: ci-output/parts/cli/${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  native:
    needs: [plan, prepare, cli-linux, cli-mac]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.plan.outputs.cli == 'true' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.native) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: cli-${{ matrix.target }}
          path: cli-part
      - run: python meshbus/scripts/ci/artifact.py cli-part native-cli
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-validation-${{ matrix.target }}
          path: native-cli/native-validation.json
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error

  products:
    name: Firmware / ${{ matrix.id }} (${{ matrix.profile }})
    needs: [plan, prepare]
    if: needs.plan.outputs.product-builds == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.prepare.outputs.image }}
      volumes:
        - /usr/local/lib/android:/__host_sdks/android
        - /usr/share/dotnet:/__host_sdks/dotnet
        - /opt/ghc:/__host_sdks/ghc
        - /usr/local/.ghcup:/__host_sdks/ghcup
        - /opt/hostedtoolcache/CodeQL:/__host_sdks/codeql
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.product-builds) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - uses: ./meshbus/.github/actions/workspace
      - env:
          BOARD: ${{ matrix.board }}
          PROFILE: ${{ matrix.profile }}
        run: python meshbus/scripts/ci/run.py product --target "$BOARD" --product-profile "$PROFILE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: product-evidence-${{ matrix.id }}-${{ matrix.profile }}
          include-hidden-files: true
          path: |
            product-build/**/build.log
            product-build/**/zephyr/.config
            product-build/**/zephyr/zephyr.map
          retention-days: ${{ inputs.retention-days }}

  required:
    name: Required checks
    if: always()
    needs: [plan, prepare, lightweight, quality, host, zephyr, cli-linux, cli-mac, native, products]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: ci-plan
          path: snapshot
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python meshbus/scripts/ci/checks.py aggregate --plan snapshot/plan.json
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.plan.outputs.sdk == 'true' || inputs.reuse-twister
        with:
          name: source-snapshot
          path: snapshot
      - if: inputs.reuse-twister
        run: python meshbus/scripts/ci/baseline.py verify --snapshot snapshot
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        if: needs.plan.outputs.sdk == 'true'
        with:
          pattern: zephyr-*
          path: test-reports
      - if: needs.plan.outputs.sdk == 'true'
        run: python meshbus/scripts/ci/test_plan.py verify --snapshot snapshot --reports test-reports
      - name: Record verified scheduling measurements
        if: needs.plan.outputs.sdk == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python meshbus/scripts/ci/timings.py collect --snapshot snapshot --reports test-reports --output ci-timings/timings.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: needs.plan.outputs.sdk == 'true'
        with:
          name: ci-timings
          path: ci-timings
          retention-days: 90
          if-no-files-found: error
