name: Website
on:
  pull_request:
    paths: &web-paths
      - 'web/**'
      - '.github/workflows/web.yml'
      - 'README.md'
      - 'apps/meshbus/README.md'
      - 'scripts/meshbus/README.md'
      - 'scripts/meshbus/APP_DEVELOPMENT.md'
      - 'subsys/llext/METADATA.md'
      - 'DEVELOPMENT.md'
      - 'docs/testing.md'
      - 'DISTRIBUTION.md'
      - 'CONTRIBUTING.md'
      - 'LICENSING.md'
  push:
    branches: [main]
    paths: *web-paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: Check and build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix web test
      - run: npm --prefix web run check
      - run: npm --prefix web run build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: web/dist
  deploy:
    name: Publish website
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy the checked artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
