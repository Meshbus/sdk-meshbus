name: Builder image
on:
  schedule:
    - cron: '0 20 * * 0' # Monday 04:00 Asia/Shanghai
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/docker/**'
      - '.github/workflows/builder.yml'
      - 'west.yml'
      - 'scripts/ci/workspace.py'
      - 'scripts/ci/image-smoke.sh'
      - 'scripts/ci/quality.py'
      - 'scripts/ci/prepare-disk.sh'
permissions:
  contents: read
concurrency:
  group: builder-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: meshbus
          persist-credentials: false
      - name: Reserve disk for image export and consumer builds
        run: bash meshbus/scripts/ci/prepare-disk.sh host
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - id: identity
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          echo "image=ghcr.io/${REPOSITORY,,}-builder" >> "$GITHUB_OUTPUT"
          echo "tag=build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: meshbus/.github/docker
          build-contexts: |
            source=./meshbus
          platforms: linux/amd64
          load: true
          tags: meshbus-builder:test
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          pull: true
          no-cache: true
      - name: Reclaim temporary image build cache
        run: |
          docker buildx prune --all --force
          df -h "$GITHUB_WORKSPACE"
      - name: Consumer builds before registry writes
        run: |
          mkdir -p snapshot
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            -e XWIN_VERSION=17 -e XWIN_SDK_VERSION=10.0.26100 -e XWIN_CRT_VERSION=14.44.17.14 \
            meshbus-builder:test bash meshbus/scripts/ci/image-smoke.sh
          docker image inspect meshbus-builder:test > snapshot/image-inspect.json
      - name: Builder OS and tool vulnerability inventory
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            meshbus-builder:test python meshbus/scripts/ci/quality.py environment
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: builder-validation
          path: |
            snapshot
            ci-output/environment-vulnerabilities.json
            smoke-*/build.log
            smoke-runtime/**/*.log
            smoke-runtime/*.json
            smoke-runtime/*.xml
          retention-days: 14
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable build and verify anonymous availability
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          TAG: ${{ steps.identity.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docker tag meshbus-builder:test "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          python meshbus/scripts/ci/image.py --repository "$REPOSITORY" --reference "$TAG" > validated-image.txt
      - name: Activate validated digest
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
        run: docker buildx imagetools create --tag "$IMAGE:stable" "$(cat validated-image.txt)"
