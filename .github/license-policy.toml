# Repository CI exceptions to file metadata and named distribution-only texts.
# This policy does not declare full REUSE compliance or grant/relicense rights.
# Board documentation raster images and plain VERSION/scalar version data are
# scoped out by scripts/ci/license_policy.py without content hashes.
# Other metadata exemptions below use exact paths and SHA256.
# Review content before adding an entry or refreshing a digest; do not bulk
# regenerate this policy from scanner failures.
# Missing license texts, invalid licenses, read errors and font checks still fail.
version = 1

# REUSE scans this source tree, not the external Cargo packages in a CLI archive.
# Keep one canonical Boost text for the clipboard-win packaging fallback without
# falsely assigning BSL-1.0 to Meshbus code or retaining a duplicate notice file.
[distribution_licenses]
"BSL-1.0" = "External clipboard-win fallback in scripts/release/artifacts.py; retained standard text is exercised by CLI archive tests."

[[exemptions]]
category = "tool-settings"
reason = "Reviewed editor, formatter, lint, line-ending and ignore settings; waive additional per-file metadata only, retaining existing notices."
