".editorconfig" = "2da14f40503a37e931a6c2869da9ba6de523138b82fd761a46a6f8fb0daf7ea9"
".gitattributes" = "f63d19fc04961c85382838429d4ce4f11c76efa83ea70a5a6d63f35d7bb7d88c"
