[package]
name = "meshbus-cli"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Standalone Meshbus build, connection, and firmware utilities"

[[bin]]
name = "meshbus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
regex = "1"
bsdiff = "0.2.1"
ed25519-dalek = { version = "2", features = ["pem", "pkcs8"] }
png = "0.18"
serde_yaml_ng = "0.10"
tar = "0.4"
lzma-rust2 = "0.13"
flate2 = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3.21"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22.1"
ciborium = "0.2.2"
clap = { version = "4.5.47", features = ["derive"] }
crc = "3.4.0"
prost = "0.14.1"
prost-reflect = { version = "0.16.5", features = ["serde"] }
probe-rs = "0.32.0"
rustyline = "18.0.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serialport = "4.8.1"
sha2 = "0.10.9"
shell-words = "1.1.0"
thiserror = "2.0.16"

[build-dependencies]
protoc-bin-vendored = "3.2.0"

[dev-dependencies]
tempfile = "3.21.0"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
