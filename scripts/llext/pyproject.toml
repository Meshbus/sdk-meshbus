[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meshbus-cli"
version = "0.1.0"
description = "Build Meshbus LLEXT application and service packages"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "Pillow>=10",
  "PyYAML>=6",
]

[project.scripts]
meshbus = "meshbus_cli.cli:main"

[tool.setuptools]
packages = ["meshbus_cli"]
py-modules = ["edk_sdk", "elf", "gen_metadata", "llext"]

[tool.setuptools.data-files]
"share/meshbus-cli" = ["app_icon.png"]
