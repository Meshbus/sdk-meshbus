# Logging
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_UART=y

# Kernel and common services
CONFIG_POLL=y
CONFIG_SHELL=n
CONFIG_HWINFO=y
CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_DEVICE_POWER_DOMAIN=y
CONFIG_PM_DEVICE_RUNTIME_ASYNC=y
CONFIG_POWER_DOMAIN=y
CONFIG_NET_BUF=y
CONFIG_CRC=y

# Cryptography and encoding
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_ZCBOR=y

# Storage and settings
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_ZMS=y
CONFIG_ZMS_LOOKUP_CACHE=n
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=n
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_LL_CACHE=y
CONFIG_SETTINGS_DYNAMIC_HANDLERS=y
CONFIG_SETTINGS_RUNTIME=y

# Messaging and statistics
CONFIG_STATS=y
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

# Meshbus common services. Role-specific defaults live in Kconfig.
CONFIG_MBS=y
CONFIG_MBS_STATS=y
CONFIG_MBS_RADIO=y
CONFIG_MBS_MESHCORE=y
CONFIG_MBS_MESHCORE_RUNTIME=y
CONFIG_MBS_MANAGEMENT=y
