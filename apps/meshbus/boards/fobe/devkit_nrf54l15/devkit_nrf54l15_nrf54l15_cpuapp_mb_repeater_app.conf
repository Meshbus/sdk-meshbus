# Repeater application profile
CONFIG_SPI=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USERSPACE=n

# Runtime resource budget
CONFIG_LOG_BUFFER_SIZE=1536
CONFIG_LOG_PRINTK=y
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
CONFIG_LOG_BACKEND_UART_ASYNC=n
CONFIG_LOG_BACKEND_UART_OUTPUT_DICTIONARY=n
CONFIG_PRINTK_SYNC=n
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_ISR_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=8
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=612
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MESHBUS_CONTACT_ADVERT_RAW_STORE=n
CONFIG_MESHBUS_CONTACT_MAX_CONTACTS=20
CONFIG_MESHBUS_MESHCORE_WORKQ_STACK_SIZE=8192
CONFIG_MESHBUS_MESHCORE_REQUEST_QUEUE_DEPTH=8
CONFIG_MESHBUS_MESHCORE_REQUEST_LARGE_QUEUE_DEPTH=2
CONFIG_MESHBUS_MESHCORE_RADIO_RX_QUEUE_DEPTH=4

# Signed swap image and local management endpoint
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SWAP_USING_OFFSET=y
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--security-counter 1"
CONFIG_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=3
CONFIG_MESHBUS_NOTIFY_TRANSPORT_SERIAL=n
CONFIG_MCUMGR_TRANSPORT_BT=n
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_RESET_BOOT_MODE=y
CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y
CONFIG_MCUMGR_GRP_FS=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MESHBUS_MESHCORE_ROLE_REPEATER=y
CONFIG_MESHBUS_MANAGEMENT_OPERATOR=n
CONFIG_MESHBUS_MANAGEMENT_ENDPOINT=y

# SX1262 radio and engineering DFOTA policy
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORA_BASICS_MODEM=y
CONFIG_MESHBUS_FIRMWARE_ASSUME_SAFE_POWER=y

# The DevKit fixture has no product peripherals.
CONFIG_SENSOR=n
CONFIG_INPUT=n
CONFIG_DISPLAY=n
CONFIG_U8G2=n
CONFIG_ZUI=n
CONFIG_LLEXT=n
CONFIG_BT=n
CONFIG_GNSS=n
CONFIG_FILE_SYSTEM=n
CONFIG_FUEL_GAUGE=n
CONFIG_CHARGER=n
CONFIG_MESHBUS_POWER=n
CONFIG_MESHBUS_INDICATOR=n
CONFIG_MESHBUS_INPUT=n
CONFIG_MESHBUS_TELEMETRY=n
CONFIG_MESHBUS_GNSS=n
CONFIG_MESHBUS_DISPLAY=n
CONFIG_MESHBUS_LLEXT=n
CONFIG_MESHBUS_DESKTOP=n
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_NONE=y
