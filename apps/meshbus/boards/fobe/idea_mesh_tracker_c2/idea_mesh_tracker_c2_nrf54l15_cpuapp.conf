# SPDX-License-Identifier: Apache-2.0

# Peripherals
CONFIG_SENSOR=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_LED=y
CONFIG_LED_PWM=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_USERSPACE=n
CONFIG_MPU=n
CONFIG_ARM_MPU=n

# Runtime resource budget
CONFIG_LOG_BUFFER_SIZE=1536
CONFIG_LOG_PRINTK=y
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
CONFIG_LOG_BACKEND_UART_ASYNC=n
CONFIG_LOG_BACKEND_UART_OUTPUT_DICTIONARY=n
CONFIG_PRINTK_SYNC=n
CONFIG_ISR_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_SYS_HEAP_INFO=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=8

# Input
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_GPIO_QDEC=y
CONFIG_INPUT_THREAD_PRIORITY_OVERRIDE=y
CONFIG_INPUT_THREAD_PRIORITY=0
CONFIG_INPUT_QUEUE_MAX_MSGS=32
CONFIG_GPIO_PCA_SERIES=y
CONFIG_GPIO_PCA_SERIES_INTERRUPT=y
CONFIG_MBS_INPUT_BUTTON_MAX=10
CONFIG_MFD=y
CONFIG_MFD_TCA8418=y
CONFIG_INPUT_TCA8418=y
CONFIG_ZUI_TEXT_EDITOR_KEYPAD_MULTI_TAP=y
CONFIG_ZUI_TEXT_EDITOR_PREDICTIVE=y
CONFIG_ZUI_TEXT_EDITOR_PREDICTIVE_DICT_SIZE=65536

# GNSS
CONFIG_GNSS=y
CONFIG_GNSS_QUECTEL_L76K=y
CONFIG_GNSS_SATELLITES=y
CONFIG_GNSS_QUECTEL_L76K_UART_RX_BUF_SIZE=1024
CONFIG_MODEM_BACKEND_UART_ISR_RECEIVE_IDLE_TIMEOUT_MS=8
CONFIG_GNSS_QUECTEL_L76K_CHAT_RX_BUF_SIZE=512

# Radio
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORA_BASICS_MODEM=y

# Storage and file system
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=2048

# Retention boot mode for MCUboot
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# MCUboot application image
# Sysbuild supplies the explicit Ed25519 image key and produces the signed slot0
# image selected by the runners metadata.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MBS_FIRMWARE_IMAGE_IDENTITY=y
CONFIG_MCUBOOT_BOOTLOADER_MODE_SINGLE_APP=y

# Display and desktop
CONFIG_DISPLAY=y
CONFIG_U8G2=y
CONFIG_ZUI=y
CONFIG_ZUI_HEAP_SIZE=12288
CONFIG_ZUI_COMMON_ICONS=y
CONFIG_LLEXT_EXPORT_SYMBOL_GROUP_ZUI=y
CONFIG_LLEXT=y
CONFIG_MBS_DISPLAY=y
CONFIG_MBS_LLEXT=y
# Rebalance 5 KiB from the general heap for the shared Radio operation
# workqueue and UART MCUmgr resources. Limit a foreground app to 88 KiB so its
# 2% dynamic-heap margin still leaves at least 5 KiB of system-heap headroom.
CONFIG_HEAP_MEM_POOL_SIZE=97280
CONFIG_MBS_LLEXT_APP_MAX_HEAP_SIZE=90112
CONFIG_MBS_LLEXT_APP_HEAP_RESERVE_SIZE=90112
CONFIG_MBS_LLEXT_APP_SYSTEM_HEAP_HEADROOM_SIZE=5120
CONFIG_MBS_LLEXT_DYNAMIC_HEAP_MARGIN_PERCENT=2
CONFIG_MBS_DESKTOP=y
CONFIG_MBS_DESKTOP_DEVICE_NAME="Mesh Tracker C2"
CONFIG_MBS_DESKTOP_MANUFACTURER_NAME="FoBE Studio"
CONFIG_MBS_DESKTOP_MODEL_NAME="F2104,1a"
CONFIG_MBS_DESKTOP_LAUNCHER=y
CONFIG_MBS_DESKTOP_THREAD_STACK_SIZE=4096
CONFIG_MBS_RADIO_OPERATION_WORK_QUEUE_STACK_SIZE=1024

# MCUmgr
CONFIG_MCUMGR=y
CONFIG_BASE64=y
CONFIG_UART_MCUMGR=y
CONFIG_UART_MCUMGR_RX_BUF_SIZE=128
CONFIG_UART_MCUMGR_RX_BUF_COUNT=5
CONFIG_UART_MCUMGR_RAW_PROTOCOL=n
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_UART_MTU=612
CONFIG_MCUMGR_TRANSPORT_UART_ASYNC=n
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=612
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_THREAD_PRIO=3
CONFIG_MCUMGR_GRP_IMG=n
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_RESET_BOOT_MODE=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_HASH_SHA256=y
CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MBS_NOTIFY_TRANSPORT_SERIAL=n
CONFIG_MESHBUS_UART_MCUMGR_LOGGING=y

# Meshbus storage profile
CONFIG_MBS_POWER=y
CONFIG_MBS_INDICATOR=y
CONFIG_MBS_MANAGEMENT_OPERATOR=y
CONFIG_MBS_MANAGEMENT_ENDPOINT=n
CONFIG_MBS_CONTACT_MAX_CONTACTS=64
# Intentional current policy; reassess storage wear before product release.
CONFIG_MBS_CONTACT_ADVERT_RAW_STORE=y
CONFIG_MBS_CHANNEL_MAX_CHANNELS=64
CONFIG_MBS_MESSAGE_MAX_STORE_COUNT=10
CONFIG_MBS_MESSAGE_PENDING_SEND_COUNT=8

# MeshCore
CONFIG_MBS_MESHCORE=y
CONFIG_MBS_MESHCORE_DEFAULT_ROLE=1
CONFIG_MBS_MESHCORE_RUNTIME=y
CONFIG_MBS_MESHCORE_CLIENT=y
CONFIG_MBS_MESHCORE_COMPANION_PROTOCOL=y
CONFIG_MBS_MESHCORE_WORKQ_STACK_SIZE=8192
CONFIG_MBS_MESHCORE_REQUEST_QUEUE_DEPTH=8
CONFIG_MBS_MESHCORE_REQUEST_LARGE_QUEUE_DEPTH=2
CONFIG_MBS_MESHCORE_RADIO_RX_QUEUE_DEPTH=4

# Sensors
CONFIG_LSM6DSL_GYRO_ODR=4
CONFIG_LSM6DSL_ACCEL_ODR=4
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_LSM6DSL_TRIGGER_NONE=y
CONFIG_COMPASS_COMPOSITE=y
CONFIG_MBS_GNSS_HEADING_SAMPLE_INTERVAL=50
CONFIG_MBS_GNSS_HEADING_PROVIDER_FAST_FREQUENCY=104
CONFIG_MBS_GNSS_HEADING_PROVIDER_SETTLE_MS=60

# Power
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_COMPOSITE=y
CONFIG_CHARGER=y
CONFIG_CHARGER_COMPOSITE=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Meshbus"
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="FoBE Studio"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="F2104,1a"
CONFIG_BT_BAS=y
CONFIG_BT_TPS=y
CONFIG_MBS_MESHCORE_COMPANION_BLUETOOTH=y

# Flash
# RRAM settings writes are short and can safely run without BLE ticker
# synchronization here. The ticker-synchronized path can wait for the full
# Nordic flash timeout window when no radio slot is granted.
CONFIG_SOC_FLASH_NRF_RADIO_SYNC_NONE=y

# MCUmgr board-specific overrides
CONFIG_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_MCUMGR_GRP_OS_DATETIME=n
CONFIG_MCUMGR_GRP_OS_DATETIME_HOOK=n

# Device capabilities, independent of the selected MeshCore role.
CONFIG_MBS_INPUT=y
CONFIG_MBS_TELEMETRY=y
CONFIG_MBS_GNSS=y
CONFIG_MBS_CONTACT=y
CONFIG_MBS_CHANNEL=y
CONFIG_MBS_NOTIFY=y
CONFIG_MBS_MESSAGE=y
CONFIG_MBS_BLUETOOTH=y
CONFIG_MBS_CLOCK=y

CONFIG_MBS_DESKTOP_PACKAGES=y

# Match registered MBA paths, including version directories.
CONFIG_MCUMGR_GRP_FS_PATH_LEN=192
