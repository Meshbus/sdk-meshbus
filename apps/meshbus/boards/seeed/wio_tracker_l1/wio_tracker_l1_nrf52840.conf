# SoC and boot
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
CONFIG_USERSPACE=n
CONFIG_MPU=n
CONFIG_ARM_MPU=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_THREAD_STACK_INFO=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_BUILD_OUTPUT_UF2=y

# Keep the complete Desktop/LLEXT host within the 692 KiB application slot.
# Local ISR tables allow Zephyr to use link-time optimization on this Cortex-M.
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y

# Runtime resource budget
# The Wio app host shares a 692 KiB application partition with the complete
# Desktop/LLEXT feature set. Compile out informational/debug logging and keep a
# smaller deferred buffer so the maintained host remains linkable.
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=8

# Peripherals
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_LED=y
CONFIG_LED_PWM=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Input
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_INPUT_QUEUE_MAX_MSGS=16
CONFIG_MBS_INPUT_BUTTON_MAX=10

# GNSS
CONFIG_GNSS=y
CONFIG_GNSS_REFERENCE_FRAME_WGS84=y
CONFIG_GNSS_QUECTEL_L76K=y
CONFIG_GNSS_SATELLITES=y
CONFIG_GNSS_QUECTEL_L76K_UART_RX_BUF_SIZE=1024
CONFIG_GNSS_QUECTEL_L76K_CHAT_RX_BUF_SIZE=512
CONFIG_GNSS_QUECTEL_L76K_SAT_ARRAY_SIZE=32
CONFIG_MODEM_BACKEND_UART_ISR_RECEIVE_IDLE_TIMEOUT_MS=8

# Radio
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORA_BASICS_MODEM=y

# Storage and file system
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=2048

# Display and desktop
CONFIG_DISPLAY=y
CONFIG_U8G2=y
CONFIG_ZUI=y
CONFIG_ZUI_HEAP_SIZE=12288
CONFIG_ZUI_COMMON_ICONS=y
CONFIG_LLEXT_EXPORT_SYMBOL_GROUP_ZUI=y
CONFIG_LLEXT=y
CONFIG_MBS_DISPLAY=y
CONFIG_MBS_LLEXT=y
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_MBS_LLEXT_APP_MAX_HEAP_SIZE=92160
CONFIG_MBS_LLEXT_APP_HEAP_RESERVE_SIZE=92160
CONFIG_MBS_LLEXT_DYNAMIC_HEAP_MARGIN_PERCENT=2
CONFIG_MBS_DESKTOP=y
CONFIG_MBS_DESKTOP_DEVICE_NAME="Wio Tracker L1"
CONFIG_MBS_DESKTOP_MANUFACTURER_NAME="Seeed"
CONFIG_MBS_DESKTOP_MODEL_NAME="Wio Tracker L1"
CONFIG_MBS_DESKTOP_LAUNCHER=y
CONFIG_MBS_DESKTOP_MESSAGE_CACHE_COUNT=8
CONFIG_MBS_DESKTOP_THREAD_STACK_SIZE=4096
CONFIG_MBS_RADIO_OPERATION_WORK_QUEUE_STACK_SIZE=512

# Logging
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_LOG_MAX_LEVEL=1
CONFIG_MBS_LLEXT_LOG_LEVEL=1

# MCUmgr
CONFIG_BASE64=y
CONFIG_UART_MCUMGR=y
CONFIG_UART_MCUMGR_RX_BUF_SIZE=512
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
CONFIG_MCUMGR_TRANSPORT_UART=y
CONFIG_MCUMGR_TRANSPORT_UART_MTU=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2048
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=y
CONFIG_MCUMGR_GRP_OS_INFO=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_GRP_FS_MAX_FILE_SIZE_4GB=y
CONFIG_MCUMGR_GRP_FS_FILE_STATUS=y
CONFIG_MCUMGR_GRP_FS_FILE_ACCESS_HOOK=y
CONFIG_MCUMGR_GRP_FS_CHECKSUM_HASH=y
CONFIG_MCUMGR_GRP_FS_HASH_SHA256=y
CONFIG_MCUMGR_GRP_ZBASIC=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=y
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y

# Meshbus storage profile
CONFIG_MBS_CONTACT_MAX_CONTACTS=64
CONFIG_MBS_CHANNEL_MAX_CHANNELS=64
CONFIG_MBS_MESSAGE_MAX_STORE_COUNT=16
CONFIG_MBS_MESSAGE_PENDING_SEND_COUNT=8

# MeshCore
CONFIG_MBS_MESHCORE=y
CONFIG_MBS_MESHCORE_DEFAULT_ROLE=1
CONFIG_MBS_MESHCORE_RUNTIME=y
CONFIG_MBS_MESHCORE_CLIENT=y
CONFIG_MBS_MESHCORE_COMPANION_PROTOCOL=y
CONFIG_MBS_MESHCORE_WORKQ_STACK_SIZE=8192
CONFIG_MBS_MESHCORE_REQUEST_QUEUE_DEPTH=8
CONFIG_MBS_MESHCORE_REQUEST_LARGE_QUEUE_DEPTH=2
CONFIG_MBS_MESHCORE_RADIO_RX_QUEUE_DEPTH=4

# Power
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_COMPOSITE=y
CONFIG_CHARGER=y
CONFIG_CHARGER_COMPOSITE=y
CONFIG_MBS_POWER_SAMPLE_INTERVAL=5000

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Meshbus"
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Seeed"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="Wio Tracker L1"
CONFIG_BT_BAS=y
CONFIG_BT_TPS=y
CONFIG_MBS_MESHCORE_COMPANION_BLUETOOTH=y

# UF2 / MCUmgr board-specific overrides
# Wio Tracker L1 keeps the Adafruit nRF52 UF2 bootloader path and does not use
# MCUboot image slots or image-management uploads for this application.
CONFIG_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_MCUMGR_GRP_IMG=n

# The UF2 bootloader is entered manually at reset; the MCUboot retention
# boot-mode request path is not available on this board.
CONFIG_RETENTION=n
CONFIG_RETENTION_BOOT_MODE=n
CONFIG_MCUMGR_GRP_OS_RESET_BOOT_MODE=n

# The OS datetime group is unavailable in this Zephyr revision.
CONFIG_MCUMGR_GRP_OS_DATETIME=n
CONFIG_MCUMGR_GRP_OS_DATETIME_HOOK=n

# Product services selected by the board overlay.
CONFIG_MBS_POWER=y
CONFIG_MBS_INPUT=y
CONFIG_MBS_INDICATOR=y
CONFIG_MBS_GNSS=y
CONFIG_MBS_TELEMETRY=y
CONFIG_MBS_CONTACT=y
CONFIG_MBS_CHANNEL=y
CONFIG_MBS_MESSAGE=y
CONFIG_MBS_BLUETOOTH=y
CONFIG_MBS_CLOCK=y
CONFIG_MBS_NOTIFY=y
