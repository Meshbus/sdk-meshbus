# Nordic SoC
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
CONFIG_USERSPACE=n

# Runtime resource budget
CONFIG_LOG_BUFFER_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=65535
CONFIG_ISR_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=8

# Peripherals
CONFIG_GPIO=y
CONFIG_GPIO_HOGS=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_LED=y
CONFIG_LED_PWM=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_INPUT=y
CONFIG_INPUT_GPIO_KEYS=y
CONFIG_MBS_INPUT_BUTTON_MAX=1
CONFIG_ZBUS_ASYNC_LISTENER=y

# GNSS
CONFIG_GNSS=y
CONFIG_GNSS_REFERENCE_FRAME_WGS84=y
CONFIG_GNSS_NMEA_GENERIC=y
CONFIG_GNSS_SATELLITES=y
CONFIG_GNSS_NMEA_GENERIC_SATELLITES_COUNT=32
CONFIG_MODEM_BACKEND_UART_ISR_RECEIVE_IDLE_TIMEOUT_MS=8

# LR1110 LoRa radio
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORA_BASICS_MODEM=y
CONFIG_LORA_BASICS_MODEM_DEFERRED_INIT=y
CONFIG_LORA_LOG_LEVEL_INF=y

# Give the UF2/CDC boot path time to re-enumerate before services start logging.
CONFIG_BOOT_DELAY=2000
CONFIG_MBS_POWER_BOOTLOADER_GPREGRET=y

# T1000-E has no screen in the Meshtastic variant configuration.
CONFIG_MBS_DISPLAY=n
CONFIG_MBS_DESKTOP=n
CONFIG_MBS_DESKTOP_LAUNCHER=n
CONFIG_DISPLAY=n
CONFIG_U8G2=n
CONFIG_ZUI=n
CONFIG_ZUI_COMMON_ICONS=n
CONFIG_LLEXT_EXPORT_SYMBOL_GROUP_ZUI=n

# T1000-E telemetry covers accelerometer and NTC temperature.
# Battery sampling is owned by the power service to avoid duplicate ADC reads.
CONFIG_MBS_TELEMETRY=y
CONFIG_SENSOR=y
CONFIG_QMA6100P=y
CONFIG_NTC_THERMISTOR=y

# Charger
CONFIG_FUEL_GAUGE=y
CONFIG_FUEL_GAUGE_COMPOSITE=y
CONFIG_CHARGER=y
CONFIG_CHARGER_COMPOSITE=y

# Keep the supplied sensor-only feature profile; file transfer and dynamic
# extensions remain disabled until product sizing and radio validation.
CONFIG_MCUMGR=n
CONFIG_IMG_MANAGER=n
CONFIG_STREAM_FLASH=n
CONFIG_MBS_MANAGEMENT=n
CONFIG_MBS_LLEXT=n
CONFIG_LLEXT=n
CONFIG_FILE_SYSTEM=n
CONFIG_FILE_SYSTEM_LITTLEFS=n

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Meshbus"
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="Seeed"
CONFIG_BT_DIS_MODEL_NUMBER=y
CONFIG_BT_DIS_MODEL_NUMBER_STR="T1000-E"
CONFIG_BT_BAS=y
CONFIG_BT_TPS=y

# Keep MeshCore and messaging disabled as in the supplied profile, pending
# firmware sizing and validation with the LR1110 radio enabled.
CONFIG_MBS_MESHCORE=n
CONFIG_MBS_MESHCORE_RUNTIME=n
CONFIG_MBS_MESSAGE=n

# The OS datetime group is unavailable in this Zephyr revision.
CONFIG_MCUMGR_GRP_OS_DATETIME=n
CONFIG_MCUMGR_GRP_OS_DATETIME_HOOK=n

# Product services selected by the board overlay.
CONFIG_MBS_POWER=y
CONFIG_MBS_INPUT=y
CONFIG_MBS_INDICATOR=y
CONFIG_MBS_GNSS=y
CONFIG_MBS_BLUETOOTH=y
