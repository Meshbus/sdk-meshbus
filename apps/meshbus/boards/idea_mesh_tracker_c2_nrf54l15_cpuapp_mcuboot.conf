# Serial recovery
CONFIG_MCUBOOT_SERIAL=y
CONFIG_BOOT_SERIAL_UART=y
CONFIG_BOOT_SERIAL_ENTRANCE_GPIO=y
CONFIG_BOOT_SERIAL_BOOT_MODE=y
CONFIG_BOOT_SERIAL_NO_APPLICATION=y
CONFIG_ENABLE_MGMT_PERUSER=n
CONFIG_BOOT_SERIAL_IMG_GRP_HASH=y

# Keep the serial baud unchanged, but accept larger SMP serial fragments if
# the host transport sends them.
CONFIG_BOOT_MAX_LINE_INPUT_LEN=1024
CONFIG_BOOT_LINE_BUFS=8
CONFIG_BOOT_SERIAL_MAX_RECEIVE_SIZE=8192

# Avoid a fixed boot delay on every normal boot.
CONFIG_BOOT_SERIAL_WAIT_FOR_DFU=n

# Recovery is physical-only: UART through MCUboot or full replacement over SWD.
CONFIG_MCUBOOT_BOOT_BLUETOOTH=n
CONFIG_BT=n

# Flash
CONFIG_NRF_RRAM_WRITE_BUFFER_SIZE=4
CONFIG_FLASH_FILL_BUFFER_SIZE=512

# Boot validation
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_BOOT_INTR_VEC_RELOC=y
CONFIG_CRC=y

# System runtime
CONFIG_GPIO=y
CONFIG_HWINFO=y

# Keep console_read/write in separate objects so the local UART activity
# wrappers can observe serial recovery traffic.
CONFIG_LTO=n
CONFIG_MULTITHREADING=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_UART_CONSOLE=n

# FoBE extensions
CONFIG_MCUBOOT_ACTION_HOOKS=y
CONFIG_MCUBOOT_INDICATOR=y

# Logging and banner
CONFIG_MCUBOOT_LOG_LEVEL_INF=y
CONFIG_BOOT_BANNER=y
CONFIG_MCUBOOT_BOOT_BANNER=y
