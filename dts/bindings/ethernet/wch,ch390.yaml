description: WCH CH390D/H standalone 10/100BASE-T Ethernet controller with SPI interface

compatible: "wch,ch390"
on-bus: spi

include: [spi-device.yaml, ethernet-controller.yaml]

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: |
      Interrupt pin of CH390. The default chip polarity is active high.
      If connected directly, the MCU pin should be configured as active high.

  reset-gpios:
    type: phandle-array
    required: true
    description: |
      Reset pin of CH390. The reset pin is active low.
      If connected directly, the MCU pin should be configured as active low.
