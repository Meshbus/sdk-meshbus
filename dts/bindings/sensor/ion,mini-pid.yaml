description: Ion Science MiniPID PPM Gas Sensor

compatible: "ion,mini-pid"

include:
  - sensor-device.yaml

properties:

  io-channels:
    type: phandle-array
    required: true
    description: ADC channel connected to the Sensor analog output

  baseline:
    type: int
    default: 52000
    description: |
      Baseline output voltage of the sensor in µV(microvolts). This value is
      subtracted from each averaged sample before scaling to VOC ppm, typical offset voltage is 52000 - 55000 µV.

  sensitivity:
    type: int
    default: 700
    description: |
      Conversion gain from µV(microvolts) above baseline to VOC concentration in
      parts-per-million. Typical responsivity is 700 µV/ppm. The driver reports
      SENSOR_CHAN_VOC as a ppm sensor_value.

  averaging-samples:
    type: int
    default: 16
    description: |
      Number of consecutive ADC samples to average for each reading.
