CONFIG_ZTEST=y
CONFIG_ASSERT=y

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y

CONFIG_EMUL=y
CONFIG_SPI=y
CONFIG_SPI_EMUL=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

CONFIG_NETWORKING=y
CONFIG_NET_TEST=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_CH390=y
CONFIG_ETH_CH390_RX_THREAD_STACK_SIZE=2048
CONFIG_ETH_CH390_FLOW_CONTROL=n

CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_BUF_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_TC_RX_COUNT=1
