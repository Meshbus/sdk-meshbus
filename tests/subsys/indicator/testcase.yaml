tests:
  subsys.meshbus.indicator.contract:
    tags:
      - meshbus
      - indicator
      - contract
      - ztest
    harness: ztest
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
  subsys.meshbus.indicator.minimal:
    tags: [meshbus, indicator, contract, ztest]
    harness: ztest
    platform_allow: [qemu_x86]
    integration_platforms: [qemu_x86]
    extra_args:
      - CONF_FILE=minimal.conf
      - INDICATOR_MINIMAL_TEST=ON
