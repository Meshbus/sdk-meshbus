CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_H4=n
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_DEVICE_NAME="MeshCore-Test"
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247

CONFIG_MBS=y
CONFIG_MBS_SHELL=n
CONFIG_MBS_STATS=y
CONFIG_MBS_NOTIFY=y
CONFIG_MBS_NOTIFY_SHELL=n
CONFIG_MBS_MESHCORE=y
CONFIG_MBS_CONTACT=y
CONFIG_MBS_MESHCORE_SHELL=n
CONFIG_MBS_CHANNEL=y
CONFIG_MBS_CHANNEL_SHELL=n
CONFIG_MBS_MESSAGE=y
CONFIG_MBS_MESSAGE_SHELL=n
CONFIG_MBS_MESSAGE_MAX_STORE_COUNT=5
CONFIG_MBS_BLUETOOTH=y
CONFIG_MBS_BLUETOOTH_SHELL=n
CONFIG_MBS_BLUETOOTH_STATS=y
CONFIG_MBS_BLUETOOTH_DEFAULT_ENABLED=n

CONFIG_MBS_MESHCORE=y
CONFIG_MBS_MESHCORE_RUNTIME=n
CONFIG_MBS_MESHCORE_COMPANION_BLUETOOTH=y

# Keep the Companion command dispatch complete for Bluetooth/NUS transport
# coverage so Twister's warning-as-error build remains valid.
CONFIG_MCUMGR=y
CONFIG_MBS_MANAGEMENT=y
CONFIG_MBS_MANAGEMENT_ENDPOINT=n
CONFIG_MBS_MANAGEMENT_OPERATOR=y

CONFIG_ZBUS_RUNTIME_OBSERVERS=y
CONFIG_ZCBOR=y
CONFIG_SETTINGS_NONE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
