CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y

CONFIG_MBS=y
CONFIG_MBS_SHELL=y
CONFIG_MBS_LLEXT=y
CONFIG_MBS_LLEXT_SHELL=y
CONFIG_MBS_LLEXT_DEFAULT_ENABLED=y
CONFIG_MBS_LLEXT_DYNAMIC_HEAP_MARGIN_PERCENT=5
CONFIG_MBS_SETTINGS_PERSISTENCE_DELAY=50

CONFIG_LLEXT=y
# Native driver calls from a loaded MBA use test-owned DT devices.
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_LLEXT_HEAP_DYNAMIC=y
CONFIG_LLEXT_SHELL=n
CONFIG_ZBUS_PRIORITY_BOOST=n
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_SIMULATOR=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_LL_CACHE=y
CONFIG_SETTINGS_ZMS_LL_CACHE_SIZE=512
CONFIG_ZMS=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_SIZE=512
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_THREAD_STACK_INFO=y

# Application service bridges
CONFIG_SENSOR=y
CONFIG_MBS_TELEMETRY=y
CONFIG_MBS_TELEMETRY_DEFAULT_ENABLED=n
CONFIG_MBS_TELEMETRY_SHELL=n
CONFIG_MBS_TELEMETRY_STATS=n
CONFIG_MBS_NOTIFY=y
CONFIG_MBS_NOTIFY_SHELL=n
CONFIG_INPUT=y
CONFIG_MBS_INPUT=y
CONFIG_MBS_INPUT_SHELL=n
