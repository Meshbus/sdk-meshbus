tests:
  subsys.meshbus.llext.contract.app:
    tags:
      - meshbus
      - llext
      - contract
      - compatibility
    harness: ztest
    extra_configs:
      - CONFIG_DISPLAY=y
      - CONFIG_U8G2=y
      - CONFIG_ZUI=y
      - CONFIG_MBS_LLEXT_APP_HEAP_RESERVE_SIZE=32768
      - CONFIG_MBS_LLEXT_APP_MAX_HEAP_SIZE=65536
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
  subsys.meshbus.llext.contract.app_shuffled:
    tags:
      - meshbus
      - llext
      - contract
      - shuffle
    harness: ztest
    extra_configs:
      - CONFIG_DISPLAY=y
      - CONFIG_U8G2=y
      - CONFIG_ZUI=y
      - CONFIG_MBS_LLEXT_APP_HEAP_RESERVE_SIZE=32768
      - CONFIG_MBS_LLEXT_APP_MAX_HEAP_SIZE=65536
      - CONFIG_ZTEST_SHUFFLE=y
      - CONFIG_TIMER_RANDOM_INITIAL_STATE=324508639
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
  subsys.meshbus.llext.contract.app_added_heap:
    tags:
      - meshbus
      - llext
      - contract
      - heap
    harness: ztest
    extra_configs:
      - CONFIG_DISPLAY=y
      - CONFIG_U8G2=y
      - CONFIG_ZUI=y
      - CONFIG_MBS_LLEXT_APP_HEAP_RESERVE_SIZE=32768
      - CONFIG_MBS_LLEXT_APP_MAX_HEAP_SIZE=65536
      - CONFIG_HEAP_MEM_POOL_SIZE=0
      - CONFIG_MBS_LLEXT_TEST_ADD_SYSTEM_HEAP=y
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
