CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_H4=n
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_BT_DEVICE_NAME="MeshCore-Test"
CONFIG_BT_DEVICE_NAME_MAX=24
CONFIG_BT_MAX_CONN=1
CONFIG_BT_L2CAP_TX_MTU=247

CONFIG_MESHBUS=y
CONFIG_MESHBUS_SHELL=n
CONFIG_MESHBUS_STATS=y
CONFIG_MESHBUS_NOTIFY=y
CONFIG_MESHBUS_NOTIFY_SHELL=n
CONFIG_MESHBUS_MESHCORE=y
CONFIG_MESHBUS_CONTACT=y
CONFIG_MESHBUS_MESHCORE_SHELL=n
CONFIG_MESHBUS_CHANNEL=y
CONFIG_MESHBUS_CHANNEL_SHELL=n
CONFIG_MESHBUS_MESSAGE=y
CONFIG_MESHBUS_MESSAGE_SHELL=n
CONFIG_MESHBUS_MESSAGE_MAX_STORE_COUNT=5
CONFIG_MESHBUS_BLUETOOTH=y
CONFIG_MESHBUS_BLUETOOTH_SHELL=n
CONFIG_MESHBUS_BLUETOOTH_STATS=y
CONFIG_MESHBUS_BLUETOOTH_DEFAULT_ENABLED=n

CONFIG_MESHBUS_MESHCORE=y
CONFIG_MESHBUS_MESHCORE_RUNTIME=n
CONFIG_MESHBUS_MESHCORE_COMPANION_BLUETOOTH=y
CONFIG_MESHBUS_MESHCORE_COMPANION_PROTOCOL_TX_WORK_DELAY_MS=0

# Keep the Companion command dispatch complete for Bluetooth/NUS transport
# coverage so Twister's warning-as-error build remains valid.
CONFIG_MCUMGR=y
CONFIG_MESHBUS_MANAGEMENT=y
CONFIG_MESHBUS_MANAGEMENT_ENDPOINT=n
CONFIG_MESHBUS_MANAGEMENT_OPERATOR=y

CONFIG_ZBUS_RUNTIME_OBSERVERS=y
CONFIG_ZCBOR=y
CONFIG_SETTINGS_NONE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
