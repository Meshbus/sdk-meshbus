CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y

CONFIG_MESHBUS=y
CONFIG_MESHBUS_SHELL=n
CONFIG_MESHBUS_CHANNEL=y
CONFIG_MESHBUS_CHANNEL_SHELL=n
CONFIG_MESHBUS_CHANNEL_MAX_CHANNELS=8
CONFIG_MESHBUS_NOTIFY=y
CONFIG_MESHBUS_NOTIFY_SHELL=n

CONFIG_ZBUS_RUNTIME_OBSERVERS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_LL_CACHE=y
