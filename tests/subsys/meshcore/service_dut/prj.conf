CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_PSA_CRYPTO=y
CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_ALG_SHA_256=y

CONFIG_MBS=y
CONFIG_MBS_SHELL=n
CONFIG_MBS_STATS=y
CONFIG_MBS_RADIO=y
CONFIG_MBS_RADIO_SHELL=n
CONFIG_MBS_RADIO_STATS=n
CONFIG_MBS_RADIO_DEFAULT_ENABLED=y
CONFIG_MBS_RADIO_DEFAULT_RECEIVE_ONLY=y
CONFIG_MBS_MESHCORE=y
CONFIG_MBS_MESHCORE_SHELL=n
CONFIG_MBS_MESHCORE_STATS=y
CONFIG_MBS_MESHCORE_DEFAULT_ROLE=2
CONFIG_MBS_MESHCORE_RUNTIME=y
CONFIG_MBS_MESHCORE_CLIENT=n
CONFIG_MBS_MESHCORE_COMPANION_PROTOCOL=n
CONFIG_MBS_MESHCORE_WORKQ_STACK_SIZE=8192
CONFIG_MBS_MESHCORE_REQUEST_QUEUE_DEPTH=4
CONFIG_MBS_MESHCORE_REQUEST_LARGE_QUEUE_DEPTH=1
CONFIG_MBS_MESHCORE_RADIO_RX_QUEUE_DEPTH=2
CONFIG_MBS_SETTINGS_PERSISTENCE_DELAY=10

CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_LORAMAC_NODE=n
CONFIG_LORA_MODULE_BACKEND_LORA_BASICS_MODEM=y
CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_ZBUS_RUNTIME_OBSERVERS=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_ZMS_LL_CACHE=y
CONFIG_SETTINGS_ZMS_LL_CACHE_SIZE=512
CONFIG_ZMS=y
CONFIG_ZMS_LOOKUP_CACHE=y
CONFIG_ZMS_LOOKUP_CACHE_SIZE=512
CONFIG_ZMS_LOOKUP_CACHE_FOR_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH_SIMULATOR=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768
