tests:
  subsys.meshbus.message.contract:
    tags:
      - meshbus
      - message
      - contract
      - ztest
    harness: ztest
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86

  subsys.meshbus.message.service_dut.mesh_probe_r2:
    tags:
      - meshbus
      - message
      - service_dut
      - ztest
    harness: ztest
    harness_config:
      fixture: mesh_probe_r2
    timeout: 30
    platform_allow:
      - mesh_probe_r2/nrf54l15/cpuapp
    integration_platforms:
      - mesh_probe_r2/nrf54l15/cpuapp
    extra_conf_files:
      - configs/service_dut.conf
