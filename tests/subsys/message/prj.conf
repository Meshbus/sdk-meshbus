CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_LOG=y

CONFIG_MBS=y
CONFIG_MBS_SHELL=n
CONFIG_MBS_MESHCORE=y
CONFIG_MBS_CONTACT=y
CONFIG_MBS_MESHCORE_SHELL=n
CONFIG_MBS_CHANNEL=y
CONFIG_MBS_CHANNEL_SHELL=n
CONFIG_MBS_NOTIFY=y
CONFIG_MBS_NOTIFY_SHELL=n
CONFIG_MBS_MESSAGE=y
CONFIG_MBS_MESSAGE_SHELL=n
CONFIG_MBS_MESSAGE_MAX_STORE_COUNT=5
CONFIG_MBS_MESSAGE_PENDING_SEND_COUNT=8
CONFIG_MBS_MESSAGE_TX_TEST_ASSUME_RADIO_READY=y

CONFIG_SETTINGS=y
CONFIG_ZBUS_RUNTIME_OBSERVERS=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_MBS_CONTACT_REQUEST_TIMEOUT_MS=10000
