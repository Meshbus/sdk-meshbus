tests:
  subsys.meshbus.clock.contract:
    tags:
      - meshbus
      - clock
      - contract
      - ztest
    harness: ztest
    platform_allow:
      - qemu_x86
    integration_platforms:
      - qemu_x86
  subsys.meshbus.clock.timestamps_only:
    tags: [meshbus, clock, contract, ztest]
    harness: ztest
    platform_allow: [qemu_x86]
    integration_platforms: [qemu_x86]
    extra_args: CONF_FILE=basic.conf
  subsys.meshbus.clock.shell:
    tags: [meshbus, clock, shell, integration, ztest]
    harness: ztest
    platform_allow: [qemu_x86]
    integration_platforms: [qemu_x86]
    extra_args: EXTRA_CONF_FILE=shell.conf
